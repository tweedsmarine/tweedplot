[package]
name = "gribdl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GRIB downloads from free sources (NOAA NOMADS GFS and GFS-Wave, ECMWF open data), cut to an area"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
grib.workspace = true
nav-core.workspace = true
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking"] }


[lints]
workspace = true
