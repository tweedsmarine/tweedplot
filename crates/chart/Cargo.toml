[package]
name = "chart"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Chart data: LINZ GeoPackage layers (coastline, depth areas, contours, soundings) served as vector tiles"

[dependencies]
rusqlite = { workspace = true, features = ["serialize"] }
zip.workspace = true
lru.workspace = true
geo = "0.31"
rayon.workspace = true
rstar = "0.12"
clipper2-rust = "1.2"
blowfish = "0.9"
crc32fast = "1"
flate2 = "1"
png = "0.17"
sha1 = "0.10"
num-bigint = "0.4"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.3"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tiny_http = "0.12"

[[example]]
name = "tileserve"

[[example]]
name = "chart_info"

[[example]]
name = "world_depth"
