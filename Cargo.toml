[workspace]
resolver = "2"
members = ["crates/nav-core", "crates/polar", "crates/signalk", "crates/chart", "crates/grib", "crates/routing", "crates/library", "crates/tracking", "crates/gribdl", "crates/tides", "crates/ais", "crates/stations", "crates/marine-nmea", "crates/bathy", "app/src-tauri", "tools/oem"]
# `cargo test` at the root skips the GUI app; build it with `npm run tauri dev` in app/.
default-members = ["crates/nav-core", "crates/polar", "crates/signalk", "crates/chart", "crates/grib", "crates/routing", "crates/library", "crates/tracking", "crates/gribdl", "crates/tides", "crates/ais", "crates/stations", "crates/bathy"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
authors = ["Chris Harris <chris@tweedsmarine.nz>"]

[workspace.dependencies]
nav-core = { path = "crates/nav-core" }
polar = { path = "crates/polar" }
signalk = { path = "crates/signalk" }
chart = { path = "crates/chart" }
grib = { path = "crates/grib" }
routing = { path = "crates/routing" }
library = { path = "crates/library" }
tracking = { path = "crates/tracking" }
gribdl = { path = "crates/gribdl" }
tides = { path = "crates/tides" }
ais = { path = "crates/ais" }
stations = { path = "crates/stations" }
marine-nmea = { path = "crates/marine-nmea" }
bathy = { path = "crates/bathy" }
serialport = { version = "4.8", default-features = false }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
lru = "0.18"
rayon = "1"
quick-xml = "0.42"

# The number crunching (GRIB decoding, routing, chart tiles, polars) is ~10x
# slower unoptimised: build those crates optimised even in `tauri dev`.
[profile.dev.package.grib]
opt-level = 3
[profile.dev.package.routing]
opt-level = 3
[profile.dev.package.chart]
opt-level = 3
[profile.dev.package.polar]
opt-level = 3
[profile.dev.package.nav-core]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
# the library (tens of thousands of marks, years of tracks) and turning results into JSON
# for the page are much faster optimised, even in development builds
[profile.dev.package.library]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.quick-xml]
opt-level = 3
[profile.dev.package.rusqlite]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.bathy]
opt-level = 3
