# Windows installers for every push to main (and by hand from the Actions tab).
# The installers are attached to the run as artifacts: Actions › the run › Artifacts.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests (library crates)
        run: cargo test # the workspace's default members: every crate but the app

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Front-end dependencies
        working-directory: app
        run: npm ci
      - name: Build the installer
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          tauriScript: npx tauri
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: racenav-windows-${{ matrix.arch }}-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
