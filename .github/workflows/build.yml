# Windows installers, the Mac app and the Linux packages, only when asked (pushes alone build
# nothing, so they cost nothing):
#  - by hand: GitHub › Actions › build › Run workflow (choose which Windows installers, which Mac
#    build and whether Linux), or `gh workflow run build.yml -f arch=arm64 -f macos=none -f linux=false`;
#  - or by putting [build] (Windows), [build-mac] (Mac) and/or [build-linux] (Linux) in the message
#    of the last commit pushed.
# The installers are attached to the run as artifacts: Actions › the run › Artifacts.
# Tagged releases are release.yml (Windows, Mac and Linux).
name: build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows installers
        type: choice
        options: [both, x64, arm64, none]
        default: both
      macos:
        description: Mac app (universal = Apple silicon and Intel in one)
        type: choice
        options: [universal, arm64, x64, none]
        default: universal
      linux:
        description: Linux x64 packages (.deb, .rpm, .AppImage)
        type: boolean
        default: false
      tests:
        description: Run the Rust tests first
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # decides whether anything runs: a run by hand, or [build] / [build-mac] in the pushed
  # commit's message (a job skipped by its `if` takes no runner time)
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[build-mac]') ||
      contains(github.event.head_commit.message, '[build-linux]')
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.m.outputs.windows }}
      mac: ${{ steps.m.outputs.mac }}
      mac_targets: ${{ steps.m.outputs.mac_targets }}
      linux: ${{ steps.m.outputs.linux }}
      tests: ${{ steps.m.outputs.tests }}
    steps:
      - id: m
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          IN_ARCH: ${{ github.event.inputs.arch }}
          IN_MAC: ${{ github.event.inputs.macos }}
          IN_LINUX: ${{ github.event.inputs.linux }}
          IN_TESTS: ${{ github.event.inputs.tests }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            arch="$IN_ARCH"; mac="$IN_MAC"; linux="$IN_LINUX"; tests="$IN_TESTS"
          else
            arch=none; mac=none; linux=false; tests=true
            case "$MSG" in *"[build]"*) arch=both ;; esac
            case "$MSG" in *"[build-mac]"*) mac=universal ;; esac
            case "$MSG" in *"[build-linux]"*) linux=true ;; esac
          fi
          echo "linux=${linux:-false}" >> "$GITHUB_OUTPUT"
          x64='{"arch":"x64","runner":"windows-latest"}'
          arm='{"arch":"arm64","runner":"windows-11-arm"}'
          case "$arch" in
            x64) inc="[$x64]" ;;
            arm64) inc="[$arm]" ;;
            none) inc="" ;;
            *) inc="[$x64,$arm]" ;;
          esac
          if [ -n "$inc" ]; then echo "windows={\"include\":$inc}" >> "$GITHUB_OUTPUT"; fi
          # Mac: the target passed to `tauri build`, and the Rust target(s) to install
          case "$mac" in
            universal) echo "mac=universal-apple-darwin" >> "$GITHUB_OUTPUT"
                       echo "mac_targets=aarch64-apple-darwin,x86_64-apple-darwin" >> "$GITHUB_OUTPUT" ;;
            arm64)     echo "mac=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
                       echo "mac_targets=aarch64-apple-darwin" >> "$GITHUB_OUTPUT" ;;
            x64)       echo "mac=x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
                       echo "mac_targets=x86_64-apple-darwin" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "tests=${tests:-true}" >> "$GITHUB_OUTPUT"

  # the library crates' tests on Linux (billed at half the Windows rate; the app isn't built)
  test:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # the Licence Manager and the S-63 Charts plugin live in their own private
      # repositories and must never come back into this one or its builds
      - name: No licence tool, S-63 code or OEM secrets in this repository
        run: |
          if git ls-files | grep -qiE '(^|/)(tools/licence|tweedplot-licence|tweedplot-charts|s63core)(/|$)|(^|/)(s63|senc|oem|device|machine)\.rs$|licences(-test)?\.tpv$|vault\.key$|signing\.key$|\.tpplugin$'; then
            echo "::error::Licence Manager files, S-63 plugin code or OEM secrets found in the repository"; exit 1; fi
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - name: Rust tests (library crates)
        run: cargo test # the workspace's default members: every crate but the app
      # a new Rust release can bring new lints: they show on the run, but don't stop the installers
      - name: Clippy (library crates)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

  windows:
    needs: [plan, test]
    # build even when the tests were skipped, not when they failed
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.windows != '' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Front-end dependencies
        working-directory: app
        run: npm ci
      - name: Build the installer
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          tauriScript: npx tauri
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: TweedPlot-windows-${{ matrix.arch }}-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # The Mac app (.app in a .dmg), on an Apple silicon runner. Mac-only settings (bundles, icon,
  # minimum macOS, ad-hoc signature) are in app/src-tauri/tauri.macos.conf.json, which Tauri
  # merges in on a Mac. Not signed with a Developer ID or notarised: see DEVELOPING.md › Mac builds.
  macos:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mac != '' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ needs.plan.outputs.mac_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-${{ needs.plan.outputs.mac }}
      - name: Front-end dependencies
        working-directory: app
        run: npm ci
      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          tauriScript: npx tauri
          args: --target ${{ needs.plan.outputs.mac }}
      - name: Keep the disk image
        uses: actions/upload-artifact@v7
        with:
          name: TweedPlot-macos-${{ needs.plan.outputs.mac }}-${{ github.sha }}
          path: target/${{ needs.plan.outputs.mac }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  # Linux x64 packages, on the older Ubuntu so they run on older distributions too (glibc).
  # Linux-only settings (deb, rpm, AppImage, icons) are in app/src-tauri/tauri.linux.conf.json.
  linux:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.linux == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries (WebKitGTK and the bundlers' tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
      - name: Front-end dependencies
        working-directory: app
        run: npm ci
      - name: Build the packages
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          tauriScript: npx tauri
      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: TweedPlot-linux-x64-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
