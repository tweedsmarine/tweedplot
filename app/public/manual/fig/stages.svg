<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-label="Every passage plan runs the same four stages, and monitoring feeds back into the plan" font-size="13"><defs><marker id="apem-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Every passage plan runs the same four stages, and monitoring feeds back into the plan</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M180 124H204" marker-end="url(#apem-arrow)"></path><path d="M360 124H384" marker-end="url(#apem-arrow)"></path><path d="M540 124H564" marker-end="url(#apem-arrow)"></path><path d="M642 172V208H282V172" marker-end="url(#apem-arrow)"></path></g><g><rect x="24" y="76" width="156" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="102" y="102" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Appraisal</text><text x="102" y="126" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">charts, tides, weather,</text><text x="102" y="142" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">boat, crew, rules</text></g><g><rect x="204" y="76" width="156" height="96" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="282" y="102" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Planning</text><text x="282" y="126" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">route, margins, timing,</text><text x="282" y="142" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">bolt holes</text></g><g><rect x="384" y="76" width="156" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="462" y="102" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Execution</text><text x="462" y="126" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">go or no-go,</text><text x="462" y="142" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">brief the crew, sail</text></g><g><rect x="564" y="76" width="156" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="642" y="102" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Monitoring</text><text x="642" y="126" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">position, weather,</text><text x="642" y="142" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">progress against plan</text></g><text x="462" y="226" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">conditions change: re-plan</text></svg>