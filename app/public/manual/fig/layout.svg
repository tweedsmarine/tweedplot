<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="The screen: rail, drawer, toolbar strip, chart and data panel side by side, so nothing covers the chart" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Nothing covers the chart: everything else sits beside it</text><g><rect x="24" y="44" width="56" height="412" rx="6" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="52" y="66" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Rail</text><text x="52" y="92" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Weather</text><text x="52" y="110" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Route</text><text x="52" y="128" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Wx routing</text><text x="52" y="146" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Targets</text><text x="52" y="164" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Library</text><text x="52" y="182" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Chart</text><text x="52" y="200" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Instr.</text><text x="52" y="218" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">Alarms</text></g><g><rect x="84" y="44" width="128" height="412" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="148" y="66" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Drawer</text><text x="148" y="88" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">when open:</text><text x="148" y="104" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">the chart narrows</text></g><g><rect x="216" y="44" width="22" height="412" rx="4" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="227" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-text-primary)" transform="rotate(-90 227 250)">Toolbar</text></g><g><rect x="242" y="44" width="318" height="360" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="401" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-secondary)">Chart</text><text x="401" y="220" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">right-click for the chart menu</text><text x="401" y="238" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">pop-ups (history, AIS cards) come and go</text></g><g><rect x="242" y="408" width="318" height="48" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="401" y="428" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Dock</text><text x="401" y="445" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">compare routings (when open)</text></g><g><rect x="564" y="44" width="172" height="412" rx="6" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="650" y="66" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Data panel</text><text x="574" y="88" font-size="11" fill="var(--cds-text-secondary)">Status · MOB · Drop</text><rect x="572" y="96" width="156" height="78" rx="4" fill="none" stroke="var(--cds-chart-axis)"></rect><text x="580" y="114" font-size="11" font-weight="600" fill="var(--cds-text-primary)">Own ship (always)</text><text x="580" y="132" font-size="11" fill="var(--cds-text-secondary)">HDG COG SOG STW</text><text x="580" y="148" font-size="11" fill="var(--cds-text-secondary)">depth, position</text><text x="580" y="164" font-size="11" fill="var(--cds-text-secondary)">local and UTC time</text><rect x="572" y="182" width="156" height="190" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-dasharray="4 3"></rect><text x="580" y="200" font-size="11" font-weight="600" fill="var(--cds-text-primary)">Sections for the</text><text x="580" y="216" font-size="11" font-weight="600" fill="var(--cds-text-primary)">view and Use (✎)</text><text x="580" y="236" font-size="11" fill="var(--cds-text-secondary)">Route, marks ahead</text><text x="580" y="252" font-size="11" fill="var(--cds-text-secondary)">Targets, wind, weather</text><text x="580" y="268" font-size="11" fill="var(--cds-text-secondary)">trend lines</text><text x="580" y="288" font-size="11" fill="var(--cds-text-secondary)">Planning: cursor,</text><text x="580" y="304" font-size="11" fill="var(--cds-text-secondary)">forecast at the cursor</text><rect x="572" y="380" width="156" height="20" rx="4" fill="none" stroke="var(--cds-chart-axis)"></rect><text x="580" y="394" font-size="11" fill="var(--cds-text-secondary)">Cursor readout</text><rect x="572" y="404" width="156" height="44" rx="4" fill="none" stroke="var(--cds-chart-axis)"></rect><text x="580" y="422" font-size="11" font-weight="600" fill="var(--cds-text-primary)">Alerts (always)</text><text x="580" y="438" font-size="11" fill="var(--cds-text-secondary)">Silence, Clear MOB…</text></g></svg>
