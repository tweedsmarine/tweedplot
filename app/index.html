<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>racenav</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <div class="row status"><span id="sk-dot" class="dot"></span><span id="sk-text">Signal K: connecting…</span></div>
      <div class="row"><span class="label">Lat</span><span id="lat" class="value">—</span></div>
      <div class="row"><span class="label">Lon</span><span id="lon" class="value">—</span></div>
      <div class="row"><span class="label">COG</span><span id="cog" class="value">—</span></div>
      <div class="row"><span class="label">SOG</span><span id="sog" class="value">—</span></div>
      <div class="row"><span class="label">HDG</span><span id="hdg" class="value">—</span></div>
      <div class="row"><span class="label">Depth</span><span id="depth" class="value">—</span></div>
      <div class="row"><span class="label">Time (UTC)</span><span id="time" class="value small">—</span></div>
      <div class="section">Chart</div>
      <div class="row"><label class="label" for="set-safety-depth">Safety depth (m)</label><input id="set-safety-depth" type="number" min="0" step="0.5" /></div>
      <div class="row"><label class="label" for="set-safety-contour">Safety contour (m)</label><input id="set-safety-contour" type="number" min="0" step="1" /></div>
      <div class="buttons">
        <button id="follow" class="on" title="Keep the boat centred">Follow</button>
        <button id="clear-track" title="Clear the track trail">Clear track</button>
      </div>
    </aside>

    <aside id="wx">
      <div class="wx-head">Weather</div>
      <div class="wx-row">
        <select id="wx-files" title="GRIB files in the GRIB folders"></select>
        <button id="wx-load" title="Load the selected GRIB">Load</button>
        <button id="wx-refresh" title="Look for new GRIB files">↻</button>
      </div>
      <div id="wx-loaded"></div>
      <div class="wx-row time">
        <button id="wx-prev" title="Back one step">◀</button>
        <button id="wx-play" title="Play / pause">▶</button>
        <button id="wx-next" title="Forward one step">▶|</button>
        <span id="wx-time">—</span>
      </div>
      <input id="wx-slider" type="range" min="0" max="0" step="3600" value="0" />
      <table id="wx-point"><thead><tr><th>Run</th><th>TWS</th><th>TWD</th><th>Gust</th><th>MSLP</th><th>Hs</th></tr></thead><tbody></tbody></table>
      <div id="wx-where" class="wx-note">Values at the cursor</div>
    </aside>

    <div id="cursor" class="cursor">—</div>
    <div class="attribution">Charts: LINZ, CC BY 4.0. Land: © OpenStreetMap contributors. Not for navigation.</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
