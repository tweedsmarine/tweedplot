[package]
name = "racenav-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "racenav desktop app (Tauri shell)"

[lib]
name = "racenav_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "racenav"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
signalk.workspace = true
polar.workspace = true
nav-core.workspace = true
chart.workspace = true
grib.workspace = true
routing.workspace = true
library.workspace = true
tracking.workspace = true
