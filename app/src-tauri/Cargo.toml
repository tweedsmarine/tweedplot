[package]
name = "racenav-app"
version = "1.0.0-alpha"
edition.workspace = true
license.workspace = true
description = "TweedPlot desktop app (Tauri shell)"

[lib]
name = "racenav_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tweedplot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
signalk.workspace = true
polar.workspace = true
nav-core.workspace = true
chart.workspace = true
portrayal.workspace = true
plugin-api.workspace = true
png = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking"] }
grib.workspace = true
routing.workspace = true
library.workspace = true
bathy.workspace = true
tracking.workspace = true
gribdl.workspace = true
tides.workspace = true
ais.workspace = true
stations.workspace = true
marine-nmea.workspace = true
serialport.workspace = true
chrono.workspace = true

[lints]
workspace = true
