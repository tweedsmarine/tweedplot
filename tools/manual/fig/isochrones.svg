<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-label="Each isochrone is everywhere the boat can reach in one more time step; the route is traced back from the mark" font-size="13"><defs><marker id="iso-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Each isochrone is everywhere the boat can reach in one more time step</text><text x="24" y="48" font-size="11.5" fill="var(--cds-text-secondary)">The router keeps the furthest-reaching points, steps again, and traces the fastest route back from the mark</text><g><path d="M392 340 C 410 290, 470 280, 500 302 C 530 325, 520 370, 480 380 C 440 390, 395 380, 392 340 Z" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><text x="456" y="338" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Land</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M130 190 Q 210 270 130 350"></path><path d="M200 130 Q 350 260 190 390"></path><path d="M280 95 Q 490 230 380 330"></path><path d="M370 80 Q 610 190 520 290"></path></g><g stroke="var(--cds-text-secondary)" stroke-width="1" stroke-dasharray="3 3"><line x1="296" y1="216" x2="366" y2="156"></line><line x1="296" y1="216" x2="384" y2="196"></line><line x1="296" y1="216" x2="382" y2="242"></line><line x1="296" y1="216" x2="358" y2="280"></line></g><g><path d="M90 270 L 172 240 L 296 216 L 420 188 L 540 178 L 650 190" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2.5" marker-end="url(#iso-arrow)"></path></g><g><circle cx="90" cy="270" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="650" cy="190" r="7" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2.5"></circle><text x="90" y="296" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Start</text><text x="650" y="174" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Mark</text></g><text x="220" y="404" font-size="11.5" fill="var(--cds-text-secondary)">Isochrones: the boat's reach after 1, 2, 3, 4 time steps</text><text x="220" y="422" font-size="11.5" fill="var(--cds-text-secondary)">Dashed spokes: a fan of headings from each point, speed from the polar at the GRIB wind</text><text x="536" y="366" font-size="11.5" fill="var(--cds-text-secondary)">steps that cross land or</text><text x="536" y="382" font-size="11.5" fill="var(--cds-text-secondary)">shallow water are dropped</text><text x="560" y="240" font-size="11.5" fill="var(--cds-text-primary)">fastest route, traced back</text></svg>