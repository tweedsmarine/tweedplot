[package]
name = "tweedplot-licence"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "TweedPlot Licence Manager: Tweedsmarine's S-63 OEM vault, licences, seats and activation codes (not shipped)"

[lib]
name = "licence"
path = "src/lib.rs"

[[bin]]
name = "tweedplot-licence"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chart.workspace = true
rusqlite = { workspace = true, features = ["serialize"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
getrandom = "0.3"
zeroize = "1.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# no dev server: with no devUrl, Tauri serves the ui folder (frontendDist) itself
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[lints]
workspace = true

[dev-dependencies]
tiny_http = "0.12"
